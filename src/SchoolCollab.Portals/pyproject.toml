[project]
name = "school-collab-portals"
version = "0.0.0"
description = "Phase-0 prefab-UI spike: ward portal surface over the existing School-Collab REST APIs. See documents/specs/teachers-ward-portal-prefab-plan.md"
requires-python = ">=3.10"
dependencies = [
    "prefab-ui==0.20.2",
    "fastapi",
    "uvicorn",
    "httpx",
]

# Dev-only: the client/route tests use httpx.MockTransport + FastAPI's TestClient,
# so they need neither a server, nor Docker, nor Playwright.
[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The typed client is async; `auto` lets the async tests stay undecorated.
asyncio_mode = "auto"
