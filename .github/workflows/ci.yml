name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A merge queue dispatches `merge_group` for its temporary main/pr-N branches and waits for this
  # workflow to report THERE. No queue can exist in this user-owned repository today — GitHub offers
  # them to organisation-owned repositories only (documents/runbooks/merge-queue-and-red-main.md) —
  # so this trigger is future-proofing: inert now, and required the day the repo moves to an
  # organisation and a queue becomes possible.
  merge_group:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Tests.Unit"
          --ignore-exit-code 8
          --report-trx
          --report-trx-filename unit-results.trx
          --results-directory ./test-results

      - name: Integration tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Tests.Integration"
          --ignore-exit-code 8
          --report-trx
          --report-trx-filename integration-results.trx
          --results-directory ./test-results
        # NOTE (corrected 2026-10-07): this variable feeds the AI HOST's `OpenRouter:ApiKey`
        # (AI.Server/Program.cs reads it; the AppHost sets it). It is NOT read by the live tests in
        # this project, which resolve `Parameters:openrouter-api-key` from user secrets / the
        # Parameters__openrouter_api_key env var — so those tests always see an empty key here and
        # self-skip as Inconclusive, regardless of this secret. Injecting the secret under the
        # test-facing name instead would make CI call OpenRouter for real; that is deliberately NOT
        # done because the live calls currently return HTTP 400 for the pinned model.
        env:
          OpenRouter__ApiKey: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: false

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx

  cross-module-wiring-guard:
    # Dedicated, fast job that fails the PR immediately if a cross-module HTTP
    # client base address is added without a matching .WithReference() in the
    # AppHost. This catches the "No such host is known (settings-api:80)" class
    # of runtime failures at build time.
    name: Cross-module wiring guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore tests/SchoolCollab.Core.Tests.Unit/SchoolCollab.Core.Tests.Unit.csproj

      - name: Build guard test project
        run: >
          dotnet build
          tests/SchoolCollab.Core.Tests.Unit/SchoolCollab.Core.Tests.Unit.csproj
          --no-restore
          --configuration Release

      - name: Run cross-module wiring guard
        run: >
          dotnet test
          tests/SchoolCollab.Core.Tests.Unit/SchoolCollab.Core.Tests.Unit.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~CrossModuleWiringTests"

  portals-python:
    # The portal (src/SchoolCollab.Portals/, Python: uv + FastAPI + Prefab UI) is
    # hosted by the AppHost and contributes no project to the .NET solution, so
    # `dotnet test` never runs its suite. This job gates it for the first time
    # (round `portal-teacher-surface`, D8): pytest + httpx.MockTransport, no
    # server, no Docker, no browser — the same container-free shape the .NET
    # hosts use, and the reason the suite needs no services.
    name: Portals (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the portal environment
        working-directory: src/SchoolCollab.Portals
        run: uv sync

      - name: Run the portal tests
        working-directory: src/SchoolCollab.Portals
        run: uv run pytest

  authportal-python:
    # The auth portal (src/SchoolCollab.AuthPortal/, the same Python stack as the teacher
    # portal) is equally invisible to `dotnet test` — it contributes no project to the .NET
    # solution. This job gates its suite the same way (pytest + httpx.MockTransport, no
    # server, no Docker, no Keycloak), so a change to its clients can never land CI-blind
    # again (added 2026-10-06, with the auth-portal symbol hoist).
    name: Auth portal (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the auth portal environment
        working-directory: src/SchoolCollab.AuthPortal
        run: uv sync

      - name: Run the auth portal tests
        working-directory: src/SchoolCollab.AuthPortal
        run: uv run pytest

  mobile:
    # DISABLED (owner, 2026-10-10) — skipped until the mobile work stabilises. The job is NOT
    # deleted on purpose: the notes below are the record of what it builds and why, and the
    # spec's acceptance item ("the `mobile` CI job exists") stays true while it is skipped.
    # Reason: it costs minutes per run in `dotnet workload install maui` on windows-latest, and
    # the mobile work it gates is still in progress. It did eventually pass on run 38057848242
    # (#331) — the problem is the wait, not the result.
    # RE-ENABLE, no code change needed:
    #     gh variable set ENABLE_MAUI_CI --body true
    # Unset, empty, or any other value = skipped. Delete this gate once the mobile work is stable.
    if: ${{ vars.ENABLE_MAUI_CI == 'true' }}

    # The Blazor Hybrid head cannot build on ubuntu — its TFMs are device platforms — and it is
    # deliberately absent from SchoolCollab.slnx, so `build-and-test` never sees it. This job
    # gates it (added 2026-10-09, round mobile-host-skeleton).
    #
    # It builds the head's Windows TFM, NOT `-f net10.0-android` as originally planned. Measured
    # 2026-10-09 (round mobile-host-skeleton inventory item (a)/(b)): the Admin.Shared closure
    # RESTORES and COMPILES for net10.0-android, but the android BUILD fails with
    #   NETSDK1082: There was no runtime pack for Microsoft.AspNetCore.App available for the
    #   specified RuntimeIdentifier 'android-arm64'/'android-x64'
    # because Admin.Shared and ServiceDefaults each declare
    # <FrameworkReference Include="Microsoft.AspNetCore.App" />, which lands on the head
    # transitively, and a self-contained mobile app needs a runtime pack per framework reference
    # — Microsoft.AspNetCore.App has none for any android RID. Severing that closure is L2 work,
    # so L1 gates what genuinely builds today; the android TFM joins this job once severance
    # lands. Windows is a real head TFM, so the job is not a proxy — the same command builds the
    # spike page and the Admin.Shared reference it renders.
    #
    # The head is built as a PROJECT with an explicit `-f`, never through
    # src/Mobile/SchoolCollab.Mobile.slnx: a solution-level `-f` passes TargetFramework as a
    # GLOBAL PROPERTY, which overrides (does not skip) the plain-net10.0 Mobile.Logic and
    # Mobile.Tests.Unit members and would force that TFM onto them. Those two live in the root
    # solution and are already built and tested by `build-and-test`.
    name: Mobile (MAUI)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # GitHub windows runners do NOT ship the MAUI workloads (the Windows TFM needs
      # maui-windows); this costs minutes per run and is the known price of the job.
      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build the mobile head (windows)
        run: >
          dotnet build
          src/Mobile/SchoolCollab.Mobile/SchoolCollab.Mobile.csproj
          -f net10.0-windows10.0.19041.0
          --configuration Release
