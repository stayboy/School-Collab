name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Tests.Unit"
          --ignore-exit-code 8
          --report-trx
          --report-trx-filename unit-results.trx
          --results-directory ./test-results

      - name: Integration tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Tests.Integration"
          --ignore-exit-code 8
          --report-trx
          --report-trx-filename integration-results.trx
          --results-directory ./test-results
        # The OpenRouter live integration tests resolve the API key from the
        # OpenRouter__ApiKey environment variable (and user secrets locally).
        # Inject the GitHub Actions secret here so CI exercises the real
        # provider. When the secret is absent (e.g. forked PRs), the key is
        # empty and the live tests self-skip as Inconclusive rather than fail.
        env:
          OpenRouter__ApiKey: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: false

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx
