name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Tests.Unit"
          --ignore-exit-code 8
          --report-trx
          --report-trx-filename unit-results.trx
          --results-directory ./test-results

      - name: Integration tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Tests.Integration"
          --ignore-exit-code 8
          --report-trx
          --report-trx-filename integration-results.trx
          --results-directory ./test-results
        # NOTE (corrected 2026-10-07): this variable feeds the AI HOST's `OpenRouter:ApiKey`
        # (AI.Server/Program.cs reads it; the AppHost sets it). It is NOT read by the live tests in
        # this project, which resolve `Parameters:openrouter-api-key` from user secrets / the
        # Parameters__openrouter_api_key env var — so those tests always see an empty key here and
        # self-skip as Inconclusive, regardless of this secret. Injecting the secret under the
        # test-facing name instead would make CI call OpenRouter for real; that is deliberately NOT
        # done because the live calls currently return HTTP 400 for the pinned model.
        env:
          OpenRouter__ApiKey: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: false

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx

  cross-module-wiring-guard:
    # Dedicated, fast job that fails the PR immediately if a cross-module HTTP
    # client base address is added without a matching .WithReference() in the
    # AppHost. This catches the "No such host is known (settings-api:80)" class
    # of runtime failures at build time.
    name: Cross-module wiring guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore tests/SchoolCollab.Core.Tests.Unit/SchoolCollab.Core.Tests.Unit.csproj

      - name: Build guard test project
        run: >
          dotnet build
          tests/SchoolCollab.Core.Tests.Unit/SchoolCollab.Core.Tests.Unit.csproj
          --no-restore
          --configuration Release

      - name: Run cross-module wiring guard
        run: >
          dotnet test
          tests/SchoolCollab.Core.Tests.Unit/SchoolCollab.Core.Tests.Unit.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~CrossModuleWiringTests"

  portals-python:
    # The portal (src/SchoolCollab.Portals/, Python: uv + FastAPI + Prefab UI) is
    # hosted by the AppHost and contributes no project to the .NET solution, so
    # `dotnet test` never runs its suite. This job gates it for the first time
    # (round `portal-teacher-surface`, D8): pytest + httpx.MockTransport, no
    # server, no Docker, no browser — the same container-free shape the .NET
    # hosts use, and the reason the suite needs no services.
    name: Portals (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the portal environment
        working-directory: src/SchoolCollab.Portals
        run: uv sync

      - name: Run the portal tests
        working-directory: src/SchoolCollab.Portals
        run: uv run pytest

  authportal-python:
    # The auth portal (src/SchoolCollab.AuthPortal/, the same Python stack as the teacher
    # portal) is equally invisible to `dotnet test` — it contributes no project to the .NET
    # solution. This job gates its suite the same way (pytest + httpx.MockTransport, no
    # server, no Docker, no Keycloak), so a change to its clients can never land CI-blind
    # again (added 2026-10-06, with the auth-portal symbol hoist).
    name: Auth portal (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync the auth portal environment
        working-directory: src/SchoolCollab.AuthPortal
        run: uv sync

      - name: Run the auth portal tests
        working-directory: src/SchoolCollab.AuthPortal
        run: uv run pytest
